<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pemesanan Tiket Bioskop</title>

    <link rel="stylesheet" href="event.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <p class="judul-kecil">🎬 BIOSKOP</p>
        <h1>Pemesanan Tiket</h1>
        <p>Pesan tiket bioskop dengan mudah</p>
      </header>

      <section class="form-pemesanan">
        <h2>📝 Form Pemesanan</h2>

        <form id="form-pemesanan">
          <label for="nama">Nama</label>
          <input type="text" id="nama" placeholder="Masukkan nama" />

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan email" />

          <label for="film">Judul Film</label>
          <input type="text" id="film" placeholder="Masukkan judul film" />

          <div class="tombol">
            <button type="submit">Pesan Tiket</button>

            <button type="button" id="tombol-reset">Reset Form</button>
          </div>
        </form>

        <p id="pesan-status"></p>
      </section>

      <section class="daftar-pesanan">
        <h2>🎫 Daftar Pesanan</h2>

        <ul id="daftar-pesanan"></ul>
      </section>

    </div>

    <script src="event.js"></script>
  </body>
</html>
